<!--
  The application mark: the same teal rounded square and pulse glyph used by
  the header logo, so the browser tab matches what is on screen.

  The glyph is lucide's `activity` path, drawn on its native 24x24 grid and
  scaled into a 32x32 tile — identical geometry to the header, which renders
  the same icon at 20px inside a 36px tile.

  The teal sits between the light and dark theme brand values. A favicon is a
  static file and cannot follow the in-app theme, and it has to stay legible
  on both a light and a dark browser tab strip.

  Stroke is 3 rather than the header's 2.5: at a 16px tab the header weight
  thins out to a hairline and the glyph loses its shape.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <rect width="32" height="32" rx="7" fill="#189a92" />
  <g transform="translate(7.1 7.1) scale(0.7417)">
    <path
      d="M22 12h-2.48a2 2 0 0 0-1.93 1.46l-2.35 8.36a.25.25 0 0 1-.48 0L9.24 2.18a.25.25 0 0 0-.48 0l-2.35 8.36A2 2 0 0 1 4.49 12H2"
      fill="none"
      stroke="#ffffff"
      stroke-width="3"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>
</svg>
